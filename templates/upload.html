<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Image Recognition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: url('/static/Designer.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }
        
        .upload-container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        
        .upload-container:hover {
            transform: translateY(-5px);
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .upload-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            margin-bottom: 25px;
            border: 2px dashed #6a11cb;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: rgba(106, 17, 203, 0.05);
            transition: all 0.3s ease;
        }
        
        .file-upload-wrapper:hover {
            background-color: rgba(106, 17, 203, 0.1);
        }
        
        .file-upload-wrapper.has-file {
            border: 2px solid #6a11cb;
        }
        
        .file-upload-content {
            text-align: center;
            color: #666;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .preview-image {
            max-width: 90%;
            max-height: 150px;
            border-radius: 8px;
            display: none;
            margin: 0 auto;
        }
        
        button[type="submit"] {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 14px 0;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.4);
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(106, 17, 203, 0.5);
        }
        
        button[type="submit"] i {
            margin-right: 8px;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
        }
        
        .loading .spinner {
            border: 4px solid rgba(106, 17, 203, 0.1);
            border-left-color: #6a11cb;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <div class="header">
            <h1>Food Image Recognition</h1>
            <p class="subtitle">Upload a photo of your food to identify it and get nutritional information</p>
        </div>
        
        <form class="upload-form" method="POST" enctype="multipart/form-data" action="/predict" id="uploadForm">
            <div class="file-upload-wrapper" id="fileUploadWrapper">
                <div class="file-upload-content">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <p>Drag & drop your image here or click to browse</p>
                    <p class="file-name" id="fileName"></p>
                </div>
                <img id="previewImage" class="preview-image" src="" alt="Preview">
                <input type="file" name="file" accept="image/*" id="fileInput">
            </div>
            
            <button type="submit"><i class="fas fa-search"></i> Identify Food</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing your image...</p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileUploadWrapper = document.getElementById('fileUploadWrapper');
        const fileName = document.getElementById('fileName');
        const previewImage = document.getElementById('previewImage');
        const uploadForm = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const fileUploadContent = document.querySelector('.file-upload-content');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileName.textContent = this.files[0].name;
                fileUploadWrapper.classList.add('has-file');
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                    fileUploadContent.style.display = 'none';
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        uploadForm.addEventListener('submit', function() {
            loading.style.display = 'block';
        });
    </script>
</body>
</html>
